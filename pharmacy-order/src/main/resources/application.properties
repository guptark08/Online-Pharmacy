# CONFIG SERVER
spring.config.import=optional:configserver:http://pharmacy-config-server:8888

spring.application.name=pharmacy-order
server.port=8083

# DATABASE
spring.datasource.url=jdbc:mysql://mysql:3306/pharmacy_order_db
spring.datasource.username=pharmacy
spring.datasource.password=pharmacy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=cGhhcm1hY3ktc3VwZXItc2VjcmV0LWtleS0yMDI0LXNwcmluZy1ib290LWp3dA==
jwt.expiration=86400000

# ✅ FIXED EUREKA
eureka.client.service-url.defaultZone=http://pharmacy-eureka:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Compatability checker disable
spring.cloud.compatibility-verifier.enabled=false

# Needed by @Value("${auth.datasource.url}")
auth.datasource.url=jdbc:mysql://mysql:3306/pharmacy_auth_db
auth.datasource.username=pharmacy
auth.datasource.password=pharmacy
