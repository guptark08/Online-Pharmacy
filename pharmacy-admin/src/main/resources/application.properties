# CONFIG SERVER
spring.config.import=optional:configserver:http://pharmacy-config-server:8888

spring.application.name=pharmacy-admin
server.port=8084

spring.datasource.url=jdbc:mysql://mysql:3306/pharmacy_catalog_db
spring.datasource.username=pharmacy
spring.datasource.password=pharmacy

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=cGhhcm1hY3ktc3VwZXItc2VjcmV0LWtleS0yMDI0LXNwcmluZy1ib290LWp3dA==
jwt.expiration=86400000
auth.datasource.url=jdbc:mysql://mysql:3306/pharmacy_auth_db
auth.datasource.username=pharmacy
auth.datasource.password=pharmacy
order.datasource.url=jdbc:mysql://mysql:3306/pharmacy_order_db
order.datasource.username=pharmacy
order.datasource.password=pharmacy

# ✅ FIXED EUREKA
eureka.client.service-url.defaultZone=http://pharmacy-eureka:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ✅ FIXED RABBITMQ
spring.rabbitmq.host=pharmacy-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=*

# Cache
spring.cache.type=simple

# Compatibility checker disable
spring.cloud.compatibility-verifier.enabled=false

