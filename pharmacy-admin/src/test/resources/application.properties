# Test configuration - overrides main application.properties

# Disable config server for tests
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

# DATABASE - Use H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=your-secret
jwt.expiration=86400000

# Disable Eureka for tests
eureka.client.enabled=false

# Disable RabbitMQ for tests
spring.rabbitmq.host=localhost

# Test datasources
auth.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
auth.datasource.username=sa
auth.datasource.password=
order.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
order.datasource.username=sa
order.datasource.password=

# Cache
spring.cache.type=simple

# Compatibility checker disable
spring.cloud.compatibility-verifier.enabled=false
