server:
  port: 8080

spring:
  application:
    name: pharmacy-gateway
  config:
    import: optional:configserver:
  cloud:
    config:
      enabled: false
    compatibility-verifier:
      enabled: false

    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        - id: auth-service
          uri: lb://pharmacy-auth
          predicates:
            - Path=/api/auth/**

        - id: catalog-service
          uri: lb://pharmacy-catalog
          predicates:
            - Path=/api/catalog/**
          filters:
            - name: JwtAuthenticationFilter

        - id: order-service
          uri: lb://pharmacy-order
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuthenticationFilter

        - id: admin-users
          uri: lb://pharmacy-auth
          predicates:
            - Path=/api/admin/users/**
          filters:
            - name: JwtAuthenticationFilter

        - id: admin-service
          uri: lb://pharmacy-admin
          predicates:
            - Path=/api/admin/**
          filters:
            - name: JwtAuthenticationFilter

# Disable EUREKA for tests
eureka:
  client:
    enabled: false

jwt:
  secret: cGhhcm1hY3ktc3VwZXItc2VjcmV0LWtleS0yMDI0LXNwcmluZy1ib290LWp3dA==
