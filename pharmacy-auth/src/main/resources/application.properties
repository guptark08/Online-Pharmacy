# CONFIG SERVER
spring.config.import=optional:configserver:http://pharmacy-config-server:8888

spring.application.name=pharmacy-auth
server.port=8081

# DATABASE
spring.datasource.url=jdbc:mysql://mysql:3306/pharmacy_auth_db
spring.datasource.username=pharmacy
spring.datasource.password=pharmacy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=cGhhcm1hY3ktc3VwZXItc2VjcmV0LWtleS0yMDI0LXNwcmluZy1ib290LWp3dA==
jwt.expiration=86400000

# ✅ FIXED EUREKA
eureka.client.service-url.defaultZone=http://pharmacy-eureka:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ✅ FIXED RABBITMQ
spring.rabbitmq.host=pharmacy-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ACTUATOR
management.endpoints.web.exposure.include=*

# CACHE
spring.cache.type=simple

# Compatability checker (disable Spring Cloud Sleuth check for SB 3.2)
spring.cloud.compatibility-verifier.enabled=false

# auth datasource config for clients
auth.datasource.url=jdbc:mysql://mysql:3306/pharmacy_auth_db

auth.datasource.username=pharmacy
auth.datasource.password=pharmacy
